[project]
name = "hermes-pmxt"
version = "0.4.0"
description = "Prediction-market SDK and read-only native Hermes plugin via PMXT"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pmxt>=2.54.0,<2.55.0",
]

[project.urls]
Homepage = "https://github.com/0xharryriddle/hermes-pmxt"
Repository = "https://github.com/0xharryriddle/hermes-pmxt"
Issues = "https://github.com/0xharryriddle/hermes-pmxt/issues"

[project.entry-points."hermes_agent.plugins"]
hermes-pmxt = "hermes_pmxt"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "unit: Unit tests that work without pmxt installed or network access",
    "integration: Integration tests that require pmxt and/or network access",
    "trading: Trading tests that spend real money -- disabled by default",
]
